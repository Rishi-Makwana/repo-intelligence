version: 1
criticality_levels: [critical, important, low]   # ordered, highest first
stale_critical:
  months: 6
  levels: [critical]
jira_base_url: https://example.atlassian.net
confluence_base_url: https://example.atlassian.net/wiki
monorepo_folders: [packages, apps, services, modules]
exclude_folders: [node_modules, vendor, build, dist, target, generated]
repos:
  - repo: owner/payments-api
    criticality: critical
    owner: team-payments
    jira_projects: [PAY]
    confluence_space: PAYDOCS
    confluence_url: https://example.atlassian.net/wiki/spaces/PAYDOCS/overview
    exclude_from_llm: false
  - repo: owner/address-ui
    owner: team-web
